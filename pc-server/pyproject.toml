[project]
name = "loudbook-pc-voice"
version = "1"
description = "Runs Loudbook's reading voice on this PC for a paired phone"
requires-python = ">=3.10,<3.14"
dependencies = [
  "sherpa-onnx==1.13.8",
  "sherpa-onnx-core==1.13.8",   # the onnxruntime.dll it needs (Windows otherwise finds an old one in System32)
  "cryptography>=43",
  "numpy>=1.26",
]

[project.optional-dependencies]
# the natural voice on an NVIDIA graphics card (setup turns this on when it finds one)
natural = [
  "chatterbox-tts==0.1.7",
  "torch==2.6.0",
  "torchaudio==2.6.0",
  "setuptools<81",   # its watermarker still imports pkg_resources, which newer setuptools dropped
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu124", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
