# Runs the app's voice-command code (VoiceCommands.java) on a desktop JVM against the real
# sherpa-onnx native library and the exact model files the phone downloads. Catches native
# crashes the phone can't report. Results go to the jvm-test release.
name: Voice commands JVM test
on:
  push:
    branches: [main]
    paths: ['app/src/com/loudbook/app/VoiceCommands.java', 'test/jvm/**', '.github/workflows/jvm-test.yml', 'app/src/com/k2fsa/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  jvm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: dl
          key: jvm-test-1-${{ matrix.arch }}
      - name: Get the native library, models and Kokoro
        run: |
          mkdir -p dl jni files/commands
          R=https://github.com/k2-fsa/sherpa-onnx/releases/download
          for n in sherpa-onnx-v1.13.8-linux-${{ matrix.arch }}-jni.tar.bz2 sherpa-onnx-v1.13.8-linux-${{ matrix.arch }}-jni-shared.tar.bz2; do
            [ -s dl/jni.tar.bz2 ] || curl -fsSL -o dl/jni.tar.bz2 $R/v1.13.8/$n || rm -f dl/jni.tar.bz2
          done
          tar xjf dl/jni.tar.bz2 -C jni
          find jni -name '*.so*' | head
          [ -s dl/kokoro.tar.bz2 ] || curl -fsSL -o dl/kokoro.tar.bz2 $R/tts-models/kokoro-multi-lang-v1_0.tar.bz2
          tar xjf dl/kokoro.tar.bz2
          for f in kws-encoder.onnx kws-decoder.onnx kws-joiner.onnx kws-tokens.txt keywords.txt speaker.onnx; do
            curl -fsSL -o files/commands/$f https://github.com/${{ github.repository }}/releases/download/commands-1/$f
          done
          ls -la files/commands
      - name: Run
        run: |
          cat > BuildInfo.java <<'J'
          package com.loudbook.app;
          final class BuildInfo { static final String VERSION = "test"; static final int CODE = 1; static final String REPO = "${{ github.repository }}";
            static final String RELEASES = "https://github.com/" + REPO + "/releases/"; static final String VOICE_URL = RELEASES + "download/voice-1/"; }
          J
          javac -nowarn -d out -sourcepath test/jvm test/jvm/com/loudbook/app/CommandsTest.java app/src/com/loudbook/app/VoiceCommands.java app/src/com/loudbook/app/Net.java BuildInfo.java app/src/com/k2fsa/sherpa/onnx/*.java
          LIB=$(dirname $(find jni -name 'libsherpa-onnx-jni.so' | head -1))
          set +e
          LD_LIBRARY_PATH=$LIB timeout 600 java -Djava.library.path=$LIB -cp out com.loudbook.app.CommandsTest files kokoro-multi-lang-v1_0 > run.log 2>&1
          echo "exit code: $?" >> run.log
          { echo '## Voice commands on the JVM (${{ matrix.arch }})'; echo; echo '```'; tail -c 6000 run.log; echo '```'; for f in hs_err*.log; do [ -f "$f" ] && { echo '```'; head -60 "$f"; echo '```'; }; done; } > results.md
          cat results.md
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f results.md ] || echo "no results" > results.md
          mv results.md results-${{ matrix.arch }}.md
          gh release view jvm-test >/dev/null 2>&1 || gh release create jvm-test --latest=false --title "Voice commands JVM test" --notes "Output of .github/workflows/jvm-test.yml"
          gh release upload jvm-test results-${{ matrix.arch }}.md --clobber
