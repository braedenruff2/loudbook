# Gemini on a web chapter, on an emulator (Android 15), against a stand-in Google on the runner
# (test/gemini/fake_gemini.py speaks with Kokoro, the way Gemini answers): how soon reading starts,
# the phone's voice filling in until Gemini's audio comes, stalls, and how close every sentence's
# cut is to where it really starts. Streamed, then not streamed. Results go to the gemini-test release.
name: Gemini test
on:
  push:
    branches: [main]
    paths: ['app/src/com/loudbook/app/ReaderService.java', 'app/src/com/loudbook/app/GeminiBook.java', 'app/src/com/loudbook/app/CloudVoice.java', 'app/src/com/loudbook/app/AsrAligner.java', 'app/src/com/loudbook/app/Align.java', 'test/gemini/**', '.github/workflows/gemini-test.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: downloads
          key: parts-sherpa-v1.13.8-kokoro-v1_0-x86
      - name: Get parts
        run: bash tools/ci-parts.sh
      - name: Build for the emulator
        run: ABI=x86_64 LB_CODE=1 LB_NAME=emulator LB_REPO="$GITHUB_REPOSITORY" bash build.sh
      - name: Serve the test chapters and the stand-in Google
        run: |
          (cd test/gemini && nohup python3 -m http.server 8000 > /tmp/http.log 2>&1 &)
          pip install -q sherpa-onnx==1.13.8 numpy
          rm -f /tmp/gem-truth.tsv /tmp/gem-requests.log
          (LATENCY=5 SPEED=2 nohup python3 test/gemini/fake_gemini.py 8001 parts/kokoro-multi-lang-v1_0 > /tmp/fake.log 2>&1 &)
          sleep 15; curl -s localhost:8000/g1.html | head -3; cat /tmp/fake.log
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        id: emu
        continue-on-error: true                 # the emulator sometimes fails to start: try once more
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash test/gemini/run.sh
      - name: Run on the emulator again (the first try failed)
        id: emu2
        if: steps.emu.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash test/gemini/run.sh
      - name: Results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## Gemini on a web chapter (Android 15, stand-in Google: 5 s wait, made at 2x)'; echo
            echo "commit ${GITHUB_SHA::7}, run ${{ github.run_id }}, emulator step: ${{ steps.emu.outcome }}, retry: ${{ steps.emu2.outcome }}"; echo
            echo '```'
            python3 test/gemini/analyze.py logcat.txt /tmp/gem-truth.tsv /tmp/gem-requests.log 2>&1
            echo '```'; echo
            echo '```'
            grep -E "LoudbookTest|AndroidRuntime|FATAL| F DEBUG|W Loudbook|E Loudbook" logcat.txt 2>/dev/null | grep -v "gemini cut" | tail -250
            echo '```'
            tail -20 /tmp/fake.log
          } > results.md
          gh release view gemini-test >/dev/null 2>&1 || gh release create gemini-test --latest=false --title "Gemini test" --notes "Output of .github/workflows/gemini-test.yml"
          gh release upload gemini-test results.md logcat.txt --clobber
