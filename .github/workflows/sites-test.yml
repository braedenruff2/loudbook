# Checks how Loudbook reads chapter pages (sites.js, bundled in app/assets/web/loudbook.js) against
# pages laid out like Royal Road, AO3, FanFiction.net, SpaceBattles, WordPress, Blogger and Substack.
# Plain Node + jsdom, no emulator: takes seconds. Add a page to test/sites/pages and a line to cases.json.
name: Sites test
on:
  push:
    branches: [main]
    paths: ['app/assets/web/loudbook.js', 'test/sites/**', '.github/workflows/sites-test.yml']
  workflow_dispatch:
jobs:
  sites:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read the test pages
        run: |
          mkdir -p /tmp/js && cd /tmp/js && npm i --no-save --silent jsdom@24
          cd "$GITHUB_WORKSPACE" && NODE_PATH=/tmp/js/node_modules node test/sites/run.js
          NODE_PATH=/tmp/js/node_modules node test/sites/offline.js
