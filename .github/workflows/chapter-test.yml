# Tests going on to the next chapter on an emulator (Android 15) with Loudbook in the background
# and the screen off, against three short chapters served from the runner. Results go to the
# chapter-test release.
name: Chapter test
on:
  push:
    branches: [main]
    paths: ['app/src/com/loudbook/app/ReaderService.java', 'app/src/com/loudbook/app/ChapterFetcher.java', 'app/src/com/loudbook/app/MainActivity.java', 'test/chapters/**', '.github/workflows/chapter-test.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  chapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: downloads
          key: parts-sherpa-v1.13.8-kokoro-v1_0-x86
      - name: Get parts
        run: bash tools/ci-parts.sh
      - name: Build for the emulator
        run: ABI=x86_64 LB_CODE=1 LB_NAME=emulator LB_REPO="$GITHUB_REPOSITORY" bash build.sh
      - name: Serve the test chapters
        run: (cd test/chapters && nohup python3 -m http.server 8000 > /tmp/http.log 2>&1 &) ; sleep 1; curl -s localhost:8000/ch1.html | head -3
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash test/chapters/run.sh
      - name: Results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## Next chapter, in the background (Android 15)'; echo
            echo 'Pages served:'; echo '```'; grep -o 'GET [^ ]*' /tmp/http.log; echo '```'; echo
            echo '```'
            grep -E "LoudbookTest|Loudbook|AndroidRuntime|FATAL| F DEBUG" logcat.txt 2>/dev/null | grep -v "SearchServiceCore\|ResourcesManager\|Choreographer" | tail -150
            echo '```'
          } > results.md
          gh release view chapter-test >/dev/null 2>&1 || gh release create chapter-test --latest=false --title "Chapter turn test" --notes "Output of .github/workflows/chapter-test.yml"
          gh release upload chapter-test results.md --clobber
