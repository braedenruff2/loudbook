# Runs Loudbook on an Android emulator (x86_64 build) and its built-in self-test, then publishes
# the log (with any native crash) to the android-test release.
name: Android test
on:
  push:
    branches: [main]
    paths: ['app/**', 'build.sh', '.github/workflows/android-test.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: downloads
          key: parts-sherpa-v1.13.8-kokoro-v1_0-x86
      - name: Get parts
        run: bash tools/ci-parts.sh
      - name: Build for the emulator
        run: ABI=x86_64 LB_CODE=1 LB_NAME=emulator LB_REPO="$GITHUB_REPOSITORY" bash build.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r build/Loudbook.apk
            adb shell pm grant com.loudbook.app android.permission.RECORD_AUDIO
            adb shell pm grant com.loudbook.app android.permission.POST_NOTIFICATIONS
            adb logcat -c
            adb shell am start -n com.loudbook.app/.MainActivity --es selftest commands,teach
            sleep 180
            adb logcat -d > logcat.txt
            adb shell pidof com.loudbook.app > alive.txt || echo "not running" > alive.txt
      - name: Results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## Loudbook on the Android emulator'; echo
            echo "app process after the test: $(cat alive.txt 2>/dev/null)"; echo
            echo '```'
            grep -E "LoudbookTest|Loudbook|AndroidRuntime|FATAL|DEBUG +:|libc +:|sherpa|onnx|tombstone|Abort|signal" logcat.txt 2>/dev/null | grep -v "ResourcesManager\|Choreographer" | tail -250
            echo '```'
          } > results.md
          gh release view android-test >/dev/null 2>&1 || gh release create android-test --latest=false --title "Android emulator test" --notes "Output of .github/workflows/android-test.yml"
          gh release upload android-test results.md --clobber
