# Runs Loudbook on an Android emulator (x86_64 build) and its built-in self-test, then publishes
# the log (with any native crash) to the android-test release.
name: Android test
on:
  push:
    branches: [main]
    paths: ['app/**', 'build.sh', '.github/workflows/android-test.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: downloads
          key: parts-sherpa-v1.13.8-kokoro-v1_0-x86
      - name: Get parts
        run: bash tools/ci-parts.sh
      - name: Build for the emulator
        run: ABI=x86_64 LB_CODE=1 LB_NAME=emulator LB_REPO="$GITHUB_REPOSITORY" bash build.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        id: emu
        continue-on-error: true                 # the emulator sometimes fails to start: try once more
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r build/Loudbook.apk
            adb shell pm grant com.loudbook.app android.permission.RECORD_AUDIO
            adb shell pm grant com.loudbook.app android.permission.POST_NOTIFICATIONS
            adb logcat -G 16M || true      # (the default 256K main log wrapped before the test ended: 773fb92)
            adb logcat -c
            adb shell am start -n com.loudbook.app/.MainActivity --es selftest commands,teach
            sleep 180
            adb logcat -d > logcat.txt
            adb logcat -d -b events 2>/dev/null | grep -E "am_kill|am_proc_died|am_low_memory|am_crash|am_anr" | grep -i "loudbook\|am_low_memory" > events.txt || true
            adb shell pidof com.loudbook.app > alive.txt || echo "not running" > alive.txt
      - name: Run on the emulator again (the first try failed)
        id: emu2
        if: steps.emu.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r build/Loudbook.apk
            adb shell pm grant com.loudbook.app android.permission.RECORD_AUDIO
            adb shell pm grant com.loudbook.app android.permission.POST_NOTIFICATIONS
            adb logcat -G 16M || true      # (the default 256K main log wrapped before the test ended: 773fb92)
            adb logcat -c
            adb shell am start -n com.loudbook.app/.MainActivity --es selftest commands,teach
            sleep 180
            adb logcat -d > logcat.txt
            adb logcat -d -b events 2>/dev/null | grep -E "am_kill|am_proc_died|am_low_memory|am_crash|am_anr" | grep -i "loudbook\|am_low_memory" > events.txt || true
            adb shell pidof com.loudbook.app > alive.txt || echo "not running" > alive.txt
      - name: Results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## Loudbook on the Android emulator'; echo
            echo "commit ${GITHUB_SHA::7}, run ${{ github.run_id }}, emulator step: ${{ steps.emu.outcome }}, retry: ${{ steps.emu2.outcome }}"; echo
            echo "app process after the test: $(cat alive.txt 2>/dev/null)"; echo
            echo "voice commands self-test: $(grep -oE 'DONE commands|FAILED commands.*|download try [0-9]+ failed.*' logcat.txt 2>/dev/null | tr '\n' ';' | cut -c1-400)"; echo
            # (why Android ended the app, if it did: killed for memory, died, crashed; 152a0ed's app died with no Java crash)
            echo "process events: $(cut -c1-200 events.txt 2>/dev/null | tr '\n' ';' | cut -c1-600)"; echo
            echo '```'
            grep -E "LoudbookTest|Loudbook|AndroidRuntime|FATAL| F DEBUG| F libc|sherpa-onnx|tombstone" logcat.txt 2>/dev/null | grep -v "SearchServiceCore\|ResourcesManager\|Choreographer" | tail -250
            echo '```'
          } > results.md
          gh release view android-test >/dev/null 2>&1 || gh release create android-test --latest=false --title "Android emulator test" --notes "Output of .github/workflows/android-test.yml"
          gh release upload android-test results.md --clobber
          [ -f logcat.txt ] && gzip -kf logcat.txt && gh release upload android-test logcat.txt.gz --clobber || true
          # a failed run's log is also kept under its own name (the next run replaces logcat.txt.gz)
          if [ -f logcat.txt ] && ! grep -q "DONE commands" logcat.txt; then cp logcat.txt.gz "logcat-${GITHUB_SHA::7}.txt.gz" && gh release upload android-test "logcat-${GITHUB_SHA::7}.txt.gz" --clobber || true; fi
      - name: Loudbook didn't crash
        if: always()
        run: |
          # (a crash used to pass unnoticed: the results were written and the job stayed green, 2026-11-01)
          if grep -q "AndroidRuntime: Process: com.loudbook.app" logcat.txt 2>/dev/null; then
            grep -A14 "AndroidRuntime: FATAL EXCEPTION" logcat.txt | head -60
            echo "::error::Loudbook crashed during the test (FATAL EXCEPTION in logcat.txt)"; exit 1
          fi
      - name: Voice commands self-test passed
        if: always()
        run: |
          # (it failed silently for a while, 2026-11-02: the download ran before the emulator's network was up; it now retries)
          if ! grep -q "DONE commands" logcat.txt 2>/dev/null; then
            grep -E "LoudbookTest: (download|FAILED)" logcat.txt | head -20
            echo "::error::The voice commands self-test didn't finish (see results.md: voice commands self-test)"; exit 1
          fi
