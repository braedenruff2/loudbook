# Builds Loudbook for the Kindle lab (an x86_64 Android emulator on Braeden's PC with the real
# Kindle app) and puts it on the "lab" release, where the lab runner downloads it. Never updates
# itself (its version code is above any release).
name: Lab build
on:
  push:
    branches: [main]
    paths: ['app/**', 'web/**', 'build.sh', '.github/workflows/lab-build.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: downloads
          key: parts-sherpa-v1.13.8-kokoro-v1_0-x86
      - name: Get parts
        run: bash tools/ci-parts.sh
      - name: Build for the emulator
        run: ABI=x86_64 LB_CODE=999999 LB_NAME="lab-${GITHUB_SHA::7}" LB_REPO="$GITHUB_REPOSITORY" bash build.sh
      - name: Publish to the lab release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/Loudbook.apk Loudbook-lab.apk
          echo "{\"commit\": \"${GITHUB_SHA::7}\", \"run\": ${{ github.run_number }}}" > lab.json
          gh release view lab >/dev/null 2>&1 || gh release create lab --latest=false --title "Kindle lab build" --notes "x86_64 build for the Kindle lab emulator (see .github/workflows/lab-build.yml)"
          gh release upload lab Loudbook-lab.apk lab.json --clobber
